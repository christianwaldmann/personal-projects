services:

  traefik:
    image: "traefik:v3.7"
    container_name: "traefik"
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=DEBUG" # DEBUG, PANIC, FATAL, ERROR, WARN, INFO
      - "--log.filePath=/logs/traefik.log"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/mnt/data/traefik/logs/:/logs/"
      - "/mnt/data/letsencrypt:/letsencrypt"

  geometrierechner:
    image: ghcr.io/christianwaldmann/geometrierechner:v0.0.2
    container_name: geometrierechner
    env_file: .env
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geometrierechner.rule=Host(`geometrierechner.${DOMAIN}`)"
      - "traefik.http.routers.geometrierechner.entrypoints=websecure"
      - "traefik.http.routers.geometrierechner.tls.certresolver=myresolver"

  bookmarks-frontend:
    image: ghcr.io/christianwaldmann/bookmarks-frontend:v0.0.6
    container_name: bookmarks-frontend
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookmarks-frontend.rule=Host(`bookmarks.${DOMAIN}`)"
      - "traefik.http.routers.bookmarks-frontend.entrypoints=websecure"
      - "traefik.http.routers.bookmarks-frontend.tls.certresolver=myresolver"
    restart: unless-stopped

  bookmarks-backend:
    image: ghcr.io/christianwaldmann/bookmarks-backend:0.0.6
    container_name: bookmarks-backend
    restart: unless-stopped
    volumes:
      - /mnt/data/bookmarks/database:/database
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookmarks-backend.rule=Host(`api.bookmarks.${DOMAIN}`)"
      - "traefik.http.routers.bookmarks-backend.entrypoints=websecure"
      - "traefik.http.routers.bookmarks-backend.tls.certresolver=myresolver"

  homepage:
    image: ghcr.io/christianwaldmann/homepage:0.0.2
    container_name: homepage
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls.certresolver=myresolver"
    restart: unless-stopped

  freshrss:
    image: freshrss/freshrss:1.27.0
    container_name: freshrss
    logging:
      options:
        max-size: 10m
    volumes:
      - /mnt/data/freshrss/data:/var/www/FreshRSS/data
      - /mnt/data/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: Europe/Berlin
      CRON_MIN: "3,33"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freshrss.rule=Host(`news.${DOMAIN}`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.routers.freshrss.tls.certresolver=myresolver"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cli/health.php"]
      timeout: 10s
      start_period: 60s
      start_interval: 11s
      interval: 75s
      retries: 3
